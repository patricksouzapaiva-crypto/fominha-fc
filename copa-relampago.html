<style>/* Fominha FC · Copa Relâmpago · sistema visual v3 */
:root{
  --bg0:#04100a;--bg1:#071a10;--bg2:#0b2616;--sf:#0f2a1b;--sf2:#143522;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --tx:#f2f7f3;--mut:#9db5a6;--mut2:#7a9586;
  --lime:#c6ff3d;--lime2:#9bdc12;--gold:#ffc83d;--gold2:#ff9f1c;--coral:#ff5a5f;--blue:#3aa0ff;--purple:#b26bff;
  --r-comum:#a9b4c0;--r-incomum:#3aa0ff;--r-rara:#b26bff;--r-lendaria:#ffb800;--r-amaldicoada:#ff3b4f;
  --rad:16px;--rad2:12px;--sh:0 10px 30px rgba(0,0,0,.35);
  --disp:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg0);color:var(--tx);font-family:var(--ui);font-size:15px;line-height:1.4}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -10%,rgba(198,255,61,.10),transparent 60%),
  radial-gradient(900px 600px at 100% 110%,rgba(58,160,255,.08),transparent 60%),
  linear-gradient(180deg,var(--bg1),var(--bg0));background-attachment:fixed}
#app{max-width:480px;margin:0 auto;padding:12px 14px 120px;min-height:100vh;position:relative}
#app.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
b,strong{font-weight:800}
.mut{color:var(--mut)}.small{font-size:13px}.xs{font-size:11.5px}
.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.3px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
.svg{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.svg.f{fill:currentColor;stroke:none}
.ttl{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.5px;font-size:24px;line-height:1.05;margin:10px 0 4px}
.ttl .svg{color:var(--lime)}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 12px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.eyebrow.g{color:var(--gold)}.eyebrow.l{color:var(--lime)}

/* ---------- botões ---------- */
.btn{appearance:none;border:0;cursor:pointer;min-height:52px;width:100%;border-radius:14px;padding:12px 18px;
  font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:17px;letter-spacing:.2px;
  color:#0c1a05;background:linear-gradient(180deg,#d8ff6a,var(--lime) 45%,var(--lime2));
  box-shadow:0 5px 0 #5f8a00,0 10px 24px rgba(198,255,61,.25),inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,box-shadow .08s,filter .15s;position:relative;overflow:hidden}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5f8a00,0 4px 10px rgba(198,255,61,.2),inset 0 1px 0 rgba(255,255,255,.6)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
.btn.shine::after{animation:shine 2.6s ease-in-out infinite 1s}
@keyframes shine{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.btn.gold{color:#2a1a00;background:linear-gradient(180deg,#ffe58a,var(--gold) 45%,var(--gold2));box-shadow:0 5px 0 #a8600a,0 10px 24px rgba(255,200,61,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.gold:active{box-shadow:0 1px 0 #a8600a}
.btn.sec{color:var(--tx);background:linear-gradient(180deg,#1d4630,#143522);box-shadow:0 4px 0 #0a1f13,inset 0 1px 0 rgba(255,255,255,.12);font-size:14.5px;min-height:48px}
.btn.sec:active{box-shadow:0 0 0 #0a1f13}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none;border:1px solid var(--line2);font-size:13px;min-height:44px;font-style:normal}
.btn.blue{color:#fff;background:linear-gradient(180deg,#63b6ff,var(--blue));box-shadow:0 5px 0 #145ea8,0 10px 24px rgba(58,160,255,.25)}
.btn:disabled,.btn.dis{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn .svg{font-size:20px}
.btn small{font-family:var(--ui);font-style:normal;font-weight:800;font-size:12px;opacity:.75;text-transform:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--tx);white-space:nowrap}
button.chip{cursor:pointer;min-height:44px;font-family:var(--ui)}
button.chip:active{transform:scale(.96)}
.coin{color:var(--gold)}
.ibtn{appearance:none;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--mut);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;font-size:14px;padding:0;position:relative}
.ibtn::before{content:"";position:absolute;inset:-8px}

/* ---------- topo ---------- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:nowrap}
.topbar .sp{flex:1}
.fichas{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:900;font-size:18px;color:var(--gold);background:linear-gradient(180deg,rgba(255,200,61,.18),rgba(255,200,61,.06));border:1px solid rgba(255,200,61,.35);padding:6px 12px;border-radius:999px;min-height:40px}
.fichas.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}

/* ---------- painéis ---------- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin:12px 0;box-shadow:var(--sh)}
.panel>h3,.ph{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.ph .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:800}
.panel.hl{border-color:rgba(198,255,61,.35);background:linear-gradient(180deg,rgba(198,255,61,.09),rgba(255,255,255,.02))}

/* ---------- home ---------- */
.hero{text-align:center;padding:18px 0 4px;position:relative}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.ballwrap{position:relative;width:84px;height:94px;flex:0 0 auto}
.fball.logo{position:absolute;left:0;top:0;width:84px;height:84px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));user-select:none;animation:ballhop 2.4s cubic-bezier(.45,0,.55,1) infinite;transform-origin:50% 50%}
.bshadow{position:absolute;left:17px;bottom:0;width:50px;height:7px;background:rgba(0,0,0,.7);border-radius:50%;background:rgba(0,0,0,.55);filter:blur(2px);animation:ballshadow 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ballhop{0%,100%{transform:translateY(4px) rotate(0)}50%{transform:translateY(-6px) rotate(25deg)}}
@keyframes ballshadow{0%,100%{transform:scaleX(1);opacity:.8}50%{transform:scaleX(.7);opacity:.45}}
.fball.ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:0 0 auto}
.fe .ic .fball.ico{width:20px;height:20px}
.fe.goal0 .ic,.fe.goal1 .ic{background:rgba(0,0,0,.35)}
.bk .fball.bk{width:26px;height:26px}
@keyframes spin{to{transform:rotate(360deg)}}
.wm{font-family:var(--disp);font-weight:900;font-style:italic;font-size:44px;line-height:.9;letter-spacing:-2px;text-transform:uppercase;text-align:left}
.wm span{display:block;font-size:22px;letter-spacing:4px;color:var(--lime);-webkit-text-stroke:0}
.modetag{display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:6px 12px;border-radius:999px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.4);color:var(--gold);font-weight:900;font-size:12px;letter-spacing:2px}
.tagline{color:var(--mut);font-size:14px;margin:10px 18px 0}
.statsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:22px;font-weight:900}
.stat span{font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.daily{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin:12px 0;border:1px solid rgba(255,200,61,.45);
  background:radial-gradient(400px 200px at 100% 0,rgba(255,200,61,.28),transparent 60%),linear-gradient(135deg,#2a2006,#13210f 60%);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.daily .dt{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase}
.daily .dt .svg{color:var(--gold);font-size:24px}
.daily .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.daily .cal{position:absolute;right:14px;top:12px;text-align:center;background:#fff;color:#111;border-radius:10px;width:54px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.35);font-weight:900}
.daily .cal i{display:block;background:var(--coral);color:#fff;font-style:normal;font-size:10px;letter-spacing:1px;padding:2px 0}
.daily .cal b{display:block;font-family:var(--disp);font-size:24px;padding:2px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{appearance:none;cursor:pointer;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx);font-weight:800;font-size:12.5px;line-height:1.15;padding:6px 4px;font-family:var(--ui)}
.seg button small{display:block;color:var(--mut);font-size:10.5px;font-weight:700}
.seg button.on{background:linear-gradient(180deg,rgba(198,255,61,.25),rgba(198,255,61,.08));border-color:var(--lime);color:#fff;box-shadow:0 0 0 1px var(--lime) inset}
.seg button.lock{opacity:.45}
.seed{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--lime);font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:3px;text-align:center;text-transform:uppercase;padding:8px}
.seed::placeholder{color:#4d6a59;letter-spacing:2px;font-size:16px}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.rk .p{font-family:var(--disp);font-weight:900;font-size:16px;text-align:center;color:var(--mut)}
.rk:nth-child(1) .p{color:var(--gold)}.rk:nth-child(2) .p{color:#d7dee6}.rk:nth-child(3) .p{color:#e0975a}
.rk .n{font-weight:800;font-size:13.5px;line-height:1.2}.rk .n small{display:block;color:var(--mut);font-weight:700;font-size:11.5px}
.rk .s{font-family:var(--disp);font-weight:900;font-size:18px;color:var(--lime)}
.rk.me{border-color:var(--gold);background:rgba(255,200,61,.08)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:10px}

/* ---------- seleção ---------- */
.selcard{position:relative;cursor:pointer;border-radius:20px;padding:14px;margin:12px 0;border:1px solid var(--line2);overflow:hidden;
  background:radial-gradient(300px 160px at 0 0,var(--c1),transparent 70%),linear-gradient(180deg,#14301f,#0c2016);box-shadow:var(--sh);transition:transform .12s}
.selcard:active{transform:scale(.985)}
.selcard .top{display:flex;align-items:center;gap:12px}
.selcard .fl{font-size:44px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.selcard .nm{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:22px;line-height:1}
.selcard .ovr{margin-left:auto;text-align:center;font-family:var(--disp);font-weight:900;font-size:28px;line-height:1}
.selcard .ovr small{display:block;font-size:10px;letter-spacing:1px;color:var(--mut);font-family:var(--ui)}
.perk{margin:10px 0;padding:9px 11px;border-radius:12px;background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.3);font-size:13px}
.perk b{color:var(--gold)}
.minisquad{display:flex;gap:4px;overflow:hidden}
.selcard .go{position:absolute;right:12px;bottom:12px}

/* ---------- carta de jogador (FUT) ---------- */
.fut{--t1:#c98a4b;--t2:#7a4a1f;--tx2:#2b1606;position:relative;width:72px;flex:0 0 auto;aspect-ratio:.72;border-radius:10px 10px 14px 14px;color:var(--tx2);
  background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35);overflow:hidden;text-align:center;font-family:var(--disp)}
.fut::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);opacity:.6}
.fut.prata{--t1:#eef2f6;--t2:#8d99a6;--tx2:#1d2630}
.fut.ouro{--t1:#ffe680;--t2:#c8901a;--tx2:#2e1d00}
.fut.lenda{--t1:#1b1b2e;--t2:#3b1f63;--tx2:#ffe27a;box-shadow:0 0 14px rgba(255,184,0,.55),0 4px 10px rgba(0,0,0,.4),inset 0 0 0 1.5px #ffce4a}
.fut.lenda::before{background:linear-gradient(115deg,transparent 30%,rgba(255,215,90,.45) 50%,transparent 70%);animation:holo 3s linear infinite}

/* ---------- itens colecionáveis ---------- */

.item{--rc:var(--r-comum);position:relative;border-radius:14px;padding:10px 10px 10px 54px;min-height:64px;cursor:pointer;

  box-shadow:0 0 0 1px rgba(0,0,0,.2) inset,0 6px 14px rgba(0,0,0,.3);text-align:left;color:var(--tx);font-family:var(--ui);transition:transform .1s}
.item:active{transform:scale(.97)}
.item .med{position:absolute;left:9px;top:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 55%,#000));box-shadow:0 0 12px color-mix(in srgb,var(--rc) 60%,transparent)}
.item.card .med{border-radius:9px}
.item .in{font-weight:900;font-size:13px;line-height:1.15}
.item .rr{font-size:9.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--rc);margin-top:2px}
.item .id{font-size:11.5px;color:#c8d8ce;margin-top:4px;line-height:1.3}
.item.lendaria{box-shadow:0 0 18px rgba(255,184,0,.3),0 6px 14px rgba(0,0,0,.3)}
.item.empty{border-style:dashed;border-color:var(--line2);background:transparent;color:var(--mut2);display:grid;place-items:center;padding:10px;font-size:11.5px;font-weight:800;cursor:default}

.item.big{padding:12px 12px 12px 62px;min-height:84px}.item.big .med{width:44px;height:44px;font-size:23px;top:14px}.item.big .in{font-size:15px}.item.big .id{font-size:12.5px}

/* ---------- técnico ---------- */
.coachhero{display:flex;gap:12px;align-items:center}
.ovrbadge{flex:0 0 auto;width:62px;height:70px;clip-path:polygon(50% 0,100% 18%,100% 78%,50% 100%,0 78%,0 18%);

.ovrbadge.ouro{background:linear-gradient(160deg,#ffe680,#c8901a);color:#2e1d00}
.ovrbadge.lenda{background:linear-gradient(160deg,#ffd66b,#7a3fd0);color:#fff}
.ovrbadge.bronze{background:linear-gradient(160deg,#c98a4b,#7a4a1f)}
.ovrbadge.prata{background:linear-gradient(160deg,#eef2f6,#8d99a6);color:#1d2630}
.drawcard{position:relative;border-radius:20px;padding:14px;margin:10px 0;border:1px solid rgba(58,160,255,.45);overflow:hidden;

.drawcard.reveal{animation:reveal .55s cubic-bezier(.2,1.4,.4,1)}

.drawcard .cn{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:21px;line-height:1.05}
.drawcard .fl{font-size:30px}
.roulette{height:150px;display:grid;place-items:center;text-align:center;border-radius:20px;margin:10px 0;border:1px dashed rgba(58,160,255,.5);background:linear-gradient(180deg,#0e2335,#0b1a14)}
.roulette .rn{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:26px;filter:blur(.3px)}
.roulette .rf{font-size:38px;line-height:1.1}
.attrs{display:grid;gap:7px;margin-top:10px}
.attr{appearance:none;width:100%;display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;text-align:left;min-height:54px;padding:8px 10px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--tx);font-family:var(--ui);transition:transform .08s,border-color .15s}
.attr:active{transform:scale(.98)}
.attr:hover{border-color:var(--blue)}

.attr.best{border-color:rgba(198,255,61,.55);background:rgba(198,255,61,.07)}
.rt{font-family:var(--disp);font-weight:900;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
.rt.t4{color:var(--lime)}.rt.t3{color:#e8f3b0}.rt.t2{color:var(--gold)}.rt.t1{color:var(--coral)}
.coachcard{border-radius:20px;padding:14px;margin:10px 0;border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,#18324a,#0d1d16 60%);box-shadow:var(--sh)}
.coachcard .cnm{font-family:var(--disp);font-weight:900;font-style:italic;font-size:19px;text-transform:uppercase;line-height:1.05}
.cname{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:#fff;font-family:var(--disp);font-weight:900;font-style:italic;font-size:17px;padding:6px 10px;text-transform:uppercase}
.ctitle{color:var(--gold);font-weight:900;font-size:13px;margin-top:3px}
.cgrid{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-top:10px}
.cslots{display:grid;gap:4px}
.cslot{display:grid;grid-template-columns:22px 34px 1fr auto;gap:6px;align-items:center;font-size:12.5px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.04)}

.radar text{font:900 9px var(--ui);fill:#cfe3d6}
.coachcard.mini .cgrid{grid-template-columns:1fr 120px}

/* ---------- hub ---------- */
.bracket{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 2px;position:relative}
.bracket::before{content:"";position:absolute;left:6%;right:6%;top:21px;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.12))}
.bk{position:relative;text-align:center;font-size:10px;font-weight:900;color:var(--mut);letter-spacing:.5px}
.bk .d{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:#0f2619;border:2px solid var(--line2);font-family:var(--disp);font-size:12px;color:var(--tx);position:relative;z-index:1}
.bk.W .d{background:linear-gradient(180deg,#d8ff6a,var(--lime2));color:#132100;border-color:transparent}
.bk.D .d{background:linear-gradient(180deg,#fff0b0,var(--gold));color:#3a2700;border-color:transparent}
.bk.L .d{background:linear-gradient(180deg,#ff8a8d,var(--coral));color:#fff;border-color:transparent}
.bk.cur .d{border-color:var(--lime);box-shadow:0 0 0 4px rgba(198,255,61,.18),0 0 18px rgba(198,255,61,.5);animation:pulse 1.6s infinite}
.bk.cur{color:var(--lime)}
.bk.boss .d{border-color:var(--gold);color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(198,255,61,0),0 0 18px rgba(198,255,61,.5)}}
.grpline{display:flex;justify-content:center;gap:10px;font-size:12px;color:var(--mut);margin:2px 0 6px}
.grpline .sep{opacity:.3}
.phasebar{display:flex;font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--mut2);margin-top:2px}
.phasebar span:first-child{flex:3;text-align:center;border-top:1px solid var(--line2);padding-top:3px}
.phasebar span:last-child{flex:4;text-align:center;border-top:1px solid rgba(255,200,61,.4);padding-top:3px;color:#c8a24a;margin-left:6px}
.vs{position:relative;border-radius:20px;padding:14px;margin:12px 0;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c0) 30%,#0c2016),#0c2016 45%,#0c2016 55%,color-mix(in srgb,var(--c1) 26%,#0c2016));box-shadow:var(--sh)}
.vs.boss{border-color:var(--gold);box-shadow:0 0 24px rgba(255,200,61,.25),var(--sh)}
.vs .vh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .tm .f{font-size:40px;line-height:1}
.vs .tm .n{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:15px;line-height:1.05;margin-top:4px}
.vs .tm .o{font-family:var(--disp);font-size:13px;color:var(--mut)}
.vs .x{font-family:var(--disp);font-weight:900;font-style:italic;font-size:30px;color:var(--gold);text-shadow:0 0 12px rgba(255,200,61,.5)}
.vs .stg{text-align:center;margin-bottom:8px}
.cmp{display:grid;grid-template-columns:30px 1fr 40px 1fr 30px;gap:6px;align-items:center;margin-top:12px;font-size:12px}
.cmp .v{font-family:var(--disp);font-weight:900;font-size:14px;text-align:center}
.cmp .l{text-align:center;font-weight:900;color:var(--mut);font-size:10.5px;letter-spacing:1px}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.bar.me{justify-content:flex-end}.bar i{display:block;height:100%;border-radius:9px}
.bar.me i{background:linear-gradient(90deg,var(--lime2),var(--lime))}.bar.op i{background:linear-gradient(90deg,var(--coral),#ff8a7a)}
.cmp .v.adv{color:var(--lime)}.cmp .v.dis{color:#ff8a8d}
.bossrule{margin-top:10px;font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35)}
.edge{margin-top:10px;text-align:center;font-size:12.5px;font-weight:800}
.formation{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1.02;background:repeating-linear-gradient(180deg,#1f7a3d 0 12.5%,#1b6e37 12.5% 25%);box-shadow:inset 0 0 40px rgba(0,0,0,.45)}

.perkline{font-size:12.5px;color:#d7e8dd;margin-top:10px}
.perkline b{color:var(--gold)}

/* ---------- partida ---------- */
.mc{position:sticky;top:0;z-index:5;margin:-12px -14px 8px;padding:10px 14px 8px;background:linear-gradient(180deg,rgba(4,16,10,.98),rgba(4,16,10,.92));backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.sb .crest{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(0,0,0,.2));border:2px solid var(--kc,#fff);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sb .tn{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.5px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sb .score{font-family:var(--disp);font-weight:900;font-size:44px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}

.prog{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--lime);width:0;transition:width .3s}

.momentum{margin:6px 0 8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}

.mstats{display:grid;grid-template-columns:1fr;gap:5px;margin-top:6px}
.ms{display:grid;grid-template-columns:28px 1fr 78px 1fr 28px;gap:6px;align-items:center;font-size:11.5px}

.ms span{text-align:center;color:var(--mut);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.pitch{position:relative;width:100%;aspect-ratio:1.55;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#238443 0 10%,#1d7a3c 10% 20%);box-shadow:inset 0 0 50px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.35)}
.pitch::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.1),transparent 60%);pointer-events:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pitch.flash{animation:pflash .8s}.pitch.shake{animation:pshake .5s}
@keyframes pflash{30%{box-shadow:inset 0 0 80px rgba(198,255,61,.75)}}

.tok{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font:900 10px var(--ui);will-change:transform;
  box-shadow:0 3px 0 rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.25)}
.tok.gk{border-style:double;border-width:3px}
.ball{position:absolute;left:0;top:0;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 60%,#888);box-shadow:0 3px 3px rgba(0,0,0,.4);z-index:3;will-change:transform}
.trail{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#fff;z-index:2;pointer-events:none;will-change:transform}
.fxbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fxbar .chip{min-height:28px;padding:3px 9px;font-size:11.5px}
.fxbar .chip.c{border-color:rgba(255,200,61,.5);color:var(--gold)}
.feedhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.feed{max-height:290px;overflow-y:auto;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);padding:4px}
.fe{display:grid;grid-template-columns:34px 24px 1fr;gap:6px;align-items:start;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px;animation:fein .35s ease-out}
@keyframes fein{from{opacity:0;transform:translateY(-6px)}}
.fe .m{font-family:var(--disp);font-weight:900;color:var(--mut);font-size:12.5px;text-align:right;padding-top:1px}
.fe .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.06);color:var(--mut)}
.fe .sub{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.fe.amb{color:#c4d6ca}.fe.amb .ic{background:none}
.fe.build{color:#e9f3ec}
.fe.hl .ic{background:rgba(58,160,255,.18);color:#8fcbff}
.fe.goal0{background:linear-gradient(90deg,rgba(198,255,61,.2),transparent);font-weight:800;border-radius:10px}.fe.goal0 .ic{background:var(--lime);color:#132100}
.fe.goal1{background:linear-gradient(90deg,rgba(255,90,95,.2),transparent);font-weight:800;border-radius:10px}.fe.goal1 .ic{background:var(--coral);color:#fff}
.fe.card{background:linear-gradient(90deg,rgba(255,200,61,.14),transparent);border-radius:10px}.fe.card .ic{background:var(--gold);color:#3a2700}
.fe.relic{background:linear-gradient(90deg,rgba(178,107,255,.16),transparent);border-radius:10px}.fe.relic .ic{background:var(--purple);color:#fff}
.fe.coach{background:linear-gradient(90deg,rgba(58,160,255,.16),transparent);border-radius:10px}.fe.coach .ic{background:var(--blue);color:#fff}
.fe.info{color:var(--mut);font-weight:800}
.fe .badge{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:1px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.12);margin-right:4px;vertical-align:1px}
.mctrl{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(4,16,10,.92) 30%);}
.mctrl>*{max-width:452px;margin:0 auto}
.mctrl .row{max-width:452px}
/* decisão */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .inner{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#14301f,#0a1a11);border-radius:24px 24px 0 0;border:1px solid var(--line2);border-bottom:0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,1.2,.4,1)}

.dhead{display:flex;align-items:center;gap:10px}
.dhead .t{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:20px;line-height:1.05}
.dtimer{margin-left:auto;position:relative;width:44px;height:44px;flex:0 0 auto}

.dctx{display:flex;gap:8px;align-items:center;margin:10px 0;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px}
.dcards{display:grid;gap:8px}
.pcard{--rc:var(--r-comum);appearance:none;width:100%;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:16px;cursor:pointer;color:var(--tx);font-family:var(--ui);
  background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 24%,#10261a),#0d1f15 75%);border:1.5px solid color-mix(in srgb,var(--rc) 70%,transparent);box-shadow:0 6px 16px rgba(0,0,0,.35);animation:dealin .35s backwards}
.pcard:active{transform:scale(.98)}
@keyframes dealin{from{opacity:0;transform:translateY(20px) rotate(-2deg)}}
.pcard .med{width:52px;height:64px;border-radius:10px;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 45%,#000))}
.pcard .in{font-weight:900;font-size:15px}.pcard .rr{font-size:9.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--rc)}
.pcard .id{font-size:12.5px;color:#d0e2d6;margin-top:3px}
.pcard .use{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--lime)}
.pcard.used{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.goalfx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.6),rgba(0,0,0,.2) 70%);animation:fade .2s}
.goalfx .gt{font-family:var(--disp);font-weight:900;font-style:italic;font-size:64px;line-height:.95;text-align:center;color:var(--lime);text-shadow:0 0 30px rgba(198,255,61,.6),0 6px 0 #355400;animation:gpop .7s cubic-bezier(.2,1.6,.4,1)}
.goalfx.rival .gt{color:#fff;text-shadow:0 0 24px rgba(255,90,95,.8),0 6px 0 #7a1418;font-size:48px}
.goalfx.mao .gt{color:var(--gold);font-size:44px}
.goalfx small{display:block;font-family:var(--ui);font-style:normal;font-size:15px;color:#fff;text-shadow:none;margin-top:10px;font-weight:800}
@keyframes gpop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:51;pointer-events:none;animation:conf 1.6s linear forwards;border-radius:2px}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- resultado ---------- */
.reshero{text-align:center;padding:10px 0 4px}
.reshero .big{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:48px;line-height:.95;letter-spacing:-1px}
.reshero .big.W{color:var(--lime);text-shadow:0 0 30px rgba(198,255,61,.4)}.reshero .big.D{color:var(--gold)}.reshero .big.L{color:var(--coral)}
.resscore{display:flex;justify-content:center;align-items:center;gap:16px;margin:10px 0}
.resscore .f{font-size:44px}.resscore .s{font-family:var(--disp);font-weight:900;font-size:54px;font-variant-numeric:tabular-nums}
.why li{margin:6px 0;font-size:13.5px}
.why{list-style:none;padding:0;margin:0}
.why li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.why li .svg{color:var(--lime);margin-top:2px}
.gl{display:grid;grid-template-columns:34px 20px 1fr;gap:6px;font-size:13.5px;padding:4px 0}
.gl .m{font-family:var(--disp);color:var(--mut);text-align:right}
.fline{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fline b{color:var(--gold);font-family:var(--disp)}
.fline.t{border:0;font-size:15px;font-weight:900}
.pens{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.pk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:3px;font-size:12px;font-weight:900}
.pk.ok{background:var(--lime);color:#132100}.pk.no{background:var(--coral);color:#fff}.pk.ok.c{box-shadow:0 0 0 2px var(--blue)}

/* ---------- recompensa (pacote) ---------- */
.packwrap{display:grid;place-items:center;padding:18px 0 6px}
.pack{appearance:none;border:0;cursor:pointer;width:180px;height:250px;border-radius:18px;position:relative;overflow:hidden;color:#132100;font-family:var(--disp);
  background:conic-gradient(from 210deg,#c6ff3d,#3aa0ff,#b26bff,#ffc83d,#c6ff3d);box-shadow:0 0 40px rgba(198,255,61,.35),0 16px 30px rgba(0,0,0,.5);animation:float 2.4s ease-in-out infinite}
.pack::before{content:"";position:absolute;inset:6px;border-radius:14px;background:linear-gradient(160deg,#173d27,#0b1d13)}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);animation:holo 2.2s linear infinite}
.pack .pi{position:relative;z-index:1;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px}
.pack .pi .svg{font-size:58px;color:var(--lime)}
.pack .pi b{font-size:22px;font-style:italic;text-transform:uppercase}
.pack .pi small{font-family:var(--ui);font-size:12px;color:var(--mut);font-weight:800}
.pack.open{animation:burst .5s forwards}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
@keyframes burst{40%{transform:scale(1.1) rotate(3deg)}100%{transform:scale(1.6);opacity:0;filter:brightness(3)}}
.offers{display:grid;gap:10px}
.offer{--rc:var(--r-comum);position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:18px;cursor:pointer;
  background:linear-gradient(135deg,color-mix(in srgb,var(--rc) 22%,#10261a),#0d1f15 70%);border:1.5px solid color-mix(in srgb,var(--rc) 65%,transparent);box-shadow:0 8px 18px rgba(0,0,0,.35);transition:transform .1s}
.offer:active{transform:scale(.98)}
.offer.flip{animation:flip .6s backwards}
@keyframes flip{0%{transform:rotateY(180deg) scale(.85);opacity:0;filter:brightness(0)}50%{opacity:1;filter:brightness(.4)}100%{transform:none;filter:none}}
.offer.lendaria{box-shadow:0 0 26px rgba(255,184,0,.45),0 8px 18px rgba(0,0,0,.35)}
.offer .med{width:60px;height:76px;border-radius:12px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 45%,#000))}
.offer .ot{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--rc)}
.offer .on{font-weight:900;font-size:16px;line-height:1.15;margin:2px 0}
.offer .od{font-size:12.5px;color:#d0e2d6}
.offer .up{display:inline-flex;gap:4px;align-items:center;margin-top:6px;font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px}
.offer .up.p{background:rgba(198,255,61,.15);color:var(--lime)}.offer .up.n{background:rgba(255,90,95,.15);color:#ff9a9d}
.offer.sold{opacity:.35;pointer-events:none}
.offer.cant .price{color:#ff9a9d;border-color:rgba(255,90,95,.5)}
.price{position:absolute;right:10px;top:10px;display:inline-flex;gap:4px;align-items:center;font-family:var(--disp);font-weight:900;font-size:15px;color:var(--gold);background:rgba(0,0,0,.45);border:1px solid rgba(255,200,61,.5);border-radius:999px;padding:3px 9px}
.offer .soldtag{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-style:italic;font-size:26px;color:#fff;transform:rotate(-8deg)}
.shopsign{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(255,200,61,.16),rgba(255,200,61,.03));border:1px solid rgba(255,200,61,.35);margin:6px 0 12px}
.shopsign .svg{font-size:30px;color:var(--gold)}
.sellrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-top:6px;cursor:pointer;min-height:48px}
.sellrow .p{margin-left:auto}

/* ---------- veredito ---------- */
.newrec{display:block;text-align:center;margin:6px auto 0;font-family:var(--disp);font-weight:900;font-style:italic;font-size:30px;color:var(--gold);text-transform:uppercase;letter-spacing:-.5px;
  text-shadow:0 0 24px rgba(255,200,61,.6);animation:recpop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes recpop{from{transform:scale(.2) rotate(-6deg);opacity:0}}
.scorebox{border-radius:20px;padding:14px;margin:10px 0;text-align:center;background:radial-gradient(300px 140px at 50% 0,rgba(198,255,61,.18),transparent 70%),linear-gradient(180deg,#123222,#0b1d14);border:1px solid rgba(198,255,61,.35);box-shadow:var(--sh)}
.scorebox .sv{font-family:var(--disp);font-weight:900;font-size:58px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(198,255,61,.35)}
.scorebox .sl{font-size:11px;letter-spacing:2px;font-weight:900;color:var(--mut)}
.formula{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;margin-top:10px;font-size:12.5px}
.formula b{font-family:var(--disp);text-align:right}
.formula .tot{border-top:1px solid var(--line2);padding-top:6px;font-weight:900;font-size:14px}
.rankpos{display:inline-flex;gap:6px;margin-top:8px;font-weight:900;font-size:13px;color:var(--gold)}
.vcard{position:relative;border-radius:24px;padding:18px 16px;margin:14px 0;overflow:hidden;border:2px solid var(--gold);
  background:radial-gradient(400px 220px at 0 0,var(--c1),transparent 70%),repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 40px,transparent 40px 80px),linear-gradient(170deg,#123b22,#081a10);box-shadow:0 0 30px rgba(255,200,61,.2),var(--sh)}
.vcard.lose{border-color:#5f8a73;box-shadow:var(--sh)}
.vcard .brand{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--lime)}
.vcard .vsel{display:flex;gap:12px;align-items:center;margin:12px 0 6px}
.vcard .vsel .f{font-size:46px;line-height:1}
.vcard .reach{font-family:var(--disp);font-weight:900;font-style:italic;text-transform:uppercase;font-size:32px;line-height:1;margin:8px 0 4px;letter-spacing:-.5px}
.vcard .vt{color:var(--gold);font-weight:900;font-size:17px}
.vcard .vf{font-style:italic;color:#dcefe2;font-size:14px;margin-top:4px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vgrid>div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px}
.vgrid .k{font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--mut);text-transform:uppercase}
.vgrid .v{font-weight:900;font-size:14px;margin-top:2px}
.vcoach{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(58,160,255,.1);border:1px solid rgba(58,160,255,.3)}
.vcoach .ovrbadge{width:44px;height:50px}.vcoach .ovrbadge b{font-size:18px}.vcoach .ovrbadge small{font-size:8px}
.vcatt{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#cfe3d6;margin-top:3px}
.vcatt b{font-family:var(--disp);color:#fff}
.vpath{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.vpath span{font-size:11px;font-weight:900;padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.07)}
.vpath .W{background:rgba(198,255,61,.18);color:var(--lime)}.vpath .D{background:rgba(255,200,61,.15);color:var(--gold)}.vpath .L{background:rgba(255,90,95,.18);color:#ff9a9d}
.vbottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vbottom>div{border-radius:14px;padding:10px;text-align:center;background:rgba(0,0,0,.35)}
.vbottom small{display:block;font-size:9.5px;font-weight:900;letter-spacing:1.2px;color:var(--mut)}
.vbottom b{font-family:var(--disp);font-size:26px;color:var(--lime);letter-spacing:1px}
.vbottom .sc b{color:var(--gold)}
.trophy{text-align:center;font-size:84px;line-height:1;margin-top:6px;animation:trophy 1s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 0 30px rgba(255,200,61,.6))}
@keyframes trophy{from{transform:translateY(-40px) scale(.3);opacity:0}}
.unlock{text-align:center;border-color:var(--gold)}

/* ---------- onboarding / info ---------- */
.tip{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:45;width:calc(100% - 28px);max-width:452px;border-radius:18px;padding:14px;
  background:linear-gradient(180deg,#1e4a8a,#14325e);border:1px solid #63b6ff;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:tipin .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes tipin{from{opacity:0;transform:translate(-50%,20px)}}
.tip .th{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.tip .th .svg{font-size:22px;color:#bfe0ff}
.tip .th .n{margin-left:auto;font-size:11px;color:#bfe0ff;letter-spacing:1px}
.tip p{margin:6px 0 10px;font-size:13.5px;color:#e6f1ff}
.tip .row .btn{min-height:44px;font-size:13px}
.tip .btn.ghost{color:#cfe4ff;border-color:rgba(255,255,255,.3)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal .box{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#163522,#0b1c12);border-radius:24px 24px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line2);animation:up .3s cubic-bezier(.2,1.2,.4,1)}
.modal h3{font-size:17px;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin:6px 0;cursor:pointer;min-height:52px}
.opt:active{transform:scale(.98)}
.info .big{display:flex;gap:12px;align-items:center}
.info .ii{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 70%,#fff),color-mix(in srgb,var(--rc) 45%,#000));box-shadow:0 0 20px color-mix(in srgb,var(--rc) 50%,transparent)}
.info .d{font-size:14.5px;margin:12px 0;line-height:1.45}
.howto ol{padding-left:0;list-style:none;margin:0;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;margin:10px 0;font-size:13.5px}
.howto li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:#132100;font-weight:900}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:80;background:#0f2a1b;border:1px solid var(--lime);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 2s forwards;max-width:92vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  body{background:radial-gradient(900px 600px at 20% 10%,rgba(198,255,61,.08),transparent 60%),radial-gradient(900px 600px at 80% 90%,rgba(58,160,255,.08),transparent 60%),repeating-linear-gradient(90deg,#06160d 0 80px,#071a10 80px 160px)}
  #app{max-width:520px;background:linear-gradient(180deg,rgba(4,16,10,.85),rgba(4,16,10,.95));border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.6)}
  .mctrl{left:50%;right:auto;width:520px;transform:translateX(-50%)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
.tip.top{top:14px;bottom:auto}
.minisquad{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.minisquad .fut{width:auto}
.minisquad .fut .r{font-size:15px;left:4px}.minisquad .fut .ps{left:4px;top:18px;font-size:8px}.minisquad .fut .sh{width:38%;top:4px;right:3px}
.minisquad .fut .nm{font-size:7.5px;bottom:12px;padding:0 2px}.minisquad .fut .tt i{font-size:6.5px;padding:0 2px}
.row .btn{font-size:13.5px;padding:10px 8px}
.btn.stack{flex-direction:column;gap:0;line-height:1.1}
/* =================== v4 =================== */
/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(5,18,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line2)}
.tabbar button{position:relative;flex:1;max-width:96px;appearance:none;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:900;letter-spacing:.3px;min-height:52px;padding:6px 2px;border-radius:12px;cursor:pointer}
.tabbar button .svg,.tabbar button .fball{font-size:22px;width:22px;height:22px}
.tabbar button.on{color:var(--lime);background:rgba(198,255,61,.09)}
.tabbar .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #05120b}
body:has(.tabbar) #app{padding-bottom:96px}
/* divisões */
.divb{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:color-mix(in srgb,var(--dc) 18%,transparent);border:1px solid color-mix(in srgb,var(--dc) 60%,transparent);color:var(--dc);font-weight:900;font-size:13px;white-space:nowrap}
.divb span{font-size:17px}.divb.sm{font-size:11.5px;padding:2px 8px 2px 4px}.divb.sm span{font-size:14px}
.divb.big{font-size:20px;padding:8px 16px 8px 10px}.divb.big span{font-size:34px}
.liga .lh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lbar{position:relative;height:12px;border-radius:8px;background:rgba(255,255,255,.08);overflow:visible}
.lbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--dc,var(--lime)),#fff);box-shadow:0 0 12px color-mix(in srgb,var(--dc,#c6ff3d) 60%,transparent);transition:width .8s}
.lbar.big{margin:0 0 10px;--dc:var(--lime)}
.lbar em{position:absolute;top:-3px;width:2px;height:18px;background:#ff9a9d;border-radius:2px}
.liga .ll{font-size:12.5px;margin-top:7px;color:#d6e8dc}
.divs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.divs>div{text-align:center;padding:6px 2px;border-radius:10px;border:1px solid var(--line);font-size:10px;opacity:.55}
.divs>div span{display:block;font-size:20px}.divs>div small{display:block;font-weight:900;color:var(--dc)}.divs>div b{font-size:10.5px}
.divs>div.on{opacity:1;border-color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent)}
.lgchip{display:flex;align-items:center;gap:10px;width:100%;appearance:none;cursor:pointer;margin:0 0 12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--tx);font-weight:800;font-size:13px}
.lgchip>span:nth-child(2){flex:1;text-align:left}
.ligam .box{text-align:center;padding-top:22px}
.dtrans{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 10px}
.dtrans .arr{font-size:28px;font-weight:900;color:var(--gold)}
.ligam .up .to{animation:promo 1.2s cubic-bezier(.2,1.6,.4,1) .3s both}
.ligam .up .from{animation:fadeout 1s .2s both}
.ligam .down .to{animation:demote 1s ease-out .3s both}
@keyframes promo{0%{transform:translateY(40px) scale(.4);opacity:0}60%{transform:translateY(-8px) scale(1.15);opacity:1;filter:drop-shadow(0 0 18px #ffc83d)}100%{transform:none}}
@keyframes demote{0%{transform:translateY(-40px);opacity:0}70%{transform:translateY(6px)}85%{transform:translateX(-4px)}100%{transform:none;opacity:1}}
@keyframes fadeout{to{opacity:.4;filter:grayscale(1)}}
/* sequência */
.streak{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;margin:12px 0 6px;background:linear-gradient(135deg,rgba(255,110,40,.22),rgba(255,200,61,.06));border:1px solid rgba(255,140,60,.45)}
.streak .fire{font-size:46px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,120,40,.7));animation:flick 1.6s ease-in-out infinite}
.streak.perdeu .fire,.streak.novo .fire{filter:grayscale(.8);animation:none}
@keyframes flick{50%{transform:scale(1.08) rotate(-3deg)}}

  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}
function makeRng(seedNum) {
  let a = seedNum >>> 0;
  const next = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const r = {
    next,
    int(a, b) { return a + Math.floor(next() * (b - a + 1)); },
    chance(p) { return next() < p; },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    shuffle(arr) { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; },
    weighted(items, wf) {
      let tot = 0; const ws = items.map(it => { const w = Math.max(0, wf(it)); tot += w; return w; });
      if (tot <= 0) return items[0];
      let x = next() * tot;
      for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x < 0) return items[i]; }
      return items[items.length - 1];
    }
  };
  return r;
}
function rngFor(seed, ...keys) { return makeRng(hashStr(String(seed) + '|' + keys.join('|'))); }
const SEED_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randomSeed(rnd) { rnd = rnd || Math.random; let s = ''; for (let i = 0; i < 6; i++) s += SEED_CHARS[Math.floor(rnd() * SEED_CHARS.length)]; return s; }
function normalizeSeed(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12); }

function lines(m, side) {

    const vb = !m.pvp && m.opp.rule === 'virada' && m.score[1] < m.score[0] ? 6 : 0;
    if (!m.pvp) return (hot || vb) ? { atk: b.atk + vb, mid: b.mid + vb - hot, def: b.def + vb, gk: b.gk + vb } : b;
    const fa = m.fxAway, away = m.away;

function pickMyScorer(m, type) {

const T = {

function tpl(s, o) { return s.replace(/\{(\w)\}/g, (_, k) => o[k] != null ? o[k] : ''); }

function ballFor(side, kind) {

function stepMatch(m) {

  }
  if (f.casinhaUntil === min) ev.push({ min, kind: 'info', text: 'O time destranca a casinha e volta a jogar.' });

  }

  } else {
    let forced = f.craque || f.peixinho;
    let lam = 15 / 90;
    if (has(run, 'bola_quadrada')) lam *= 0.85;

function chooseType(m, side) {
  const r = m.rng, run = m.run, f = m.fx, min = m.minute;

    w.cruz += crossBonus(m) * 4;
    if (min <= f.chuvaUntil) { w.cruz += 70; w.escanteio += 10; }
    if (min <= f.longeUntil) w.fora += 70;
    const bp = cs(run, 'bol'); w.escanteio += 0.6 * bp; w.falta += 0.4 * bp;
    if (has(run, 'escanteio_nunca')) w.escanteio *= 1.5;

  if (has(run, 'bola_quadrada')) { w.fora += 12; w.jogada -= 10; }

  if (side === 1 && m.opp.rule === 'fora') w.fora += 10;
  const keys = Object.keys(w);
  return r.weighted(keys, k => w[k]);
}

function resolveLance(m, side, forcedType, ev, opts) {

  const r = m.rng, run = m.run, f = m.fx, min = m.minute, st = m.stage;
  const type = forcedType || chooseType(m, side);
  const A = lines(m, side), D = lines(m, 1 - side);
  const teamName = side === 0 ? SELECOES[run.selecao].curto : m.opp.nome;
  const gkName = side === 0 ? m.opp.gk : run.players.find(p => p.pos === 'GOL').nome;
  m.stats.lances[side]++;
  let byCard = null;
  let q, scorerName, scorerRating, gtype = type, text, crossName = '', isGK = false, qNo = -1, atkB = 0, bolB = 0;
  const tagsHeader = [];

    if (f.craque) { si = bestPlayer(run, st, p => p.pos !== 'GOL'); byCard = 'craque'; f.craque = false; }
    else if (f.peixinho) { si = pickMyScorer(m, 'cabeca'); byCard = 'peixinho'; f.peixinho = false; }
    else if (type === 'escanteio' && has(run, 'luva_ofensiva') && r.chance(0.3)) { si = gkI; isGK = true; }
    else if (type === 'falta' && has(run, 'luva_ofensiva') && r.chance(0.35)) { si = gkI; isGK = true; }
    else if (type === 'fora' && has(run, 'luva_ofensiva') && r.chance(0.12)) { si = gkI; isGK = true; }
    else if (type === 'cruz' || type === 'escanteio') si = pickMyScorer(m, 'cabeca');
    else si = pickMyScorer(m, type);
    scorerName = run.players[si].nome; scorerRating = effRating(run, si, st);
    if (isGK) scorerRating = Math.max(scorerRating, 70);
    if (type === 'cruz' || type === 'escanteio') crossName = run.players[pickCrosser(m)].nome;
    if (crossName === scorerName) crossName = 'o lateral';
  } else {
    const oi = oppScorer(m);
    scorerName = m.opp.scorers[oi]; scorerRating = oppScorerRating(m, oi);
    crossName = 'o ponta';
  }

  const o = { p: scorerName, c: crossName, t: teamName, g: gkName };
  // base de qualidade por tipo
  if (type === 'jogada') { q = 0.28; text = tpl(r.pick(side === 0 ? T.jogada : T.jogadaOpp), o); gtype = 'normal'; if (byCard === 'craque') { q += 0.32 + CK.estQ * cs(run, 'est'); text = `⭐ Craque decide! ${scorerName} pega a bola e parte pra cima...`; } }
  else if (type === 'cruz') { q = 0.22 + (side === 0 ? crossBonus(m) * 0.02 : 0); gtype = 'cabeca'; text = tpl(r.pick(side === 0 ? T.cruz : T.cruzOpp), o);
    if (side === 0 && min <= f.chuvaUntil) { q += 0.06; byCard = byCard || 'chuveirinho'; }
    if (byCard === 'peixinho') { q += 0.34 + CK.estQ * cs(run, 'est'); text = `🐟 PEIXINHO! ${crossName} cruza rasteiro e ${scorerName} se atira de cabeça...`; } }
  else if (type === 'fora') { q = 0.12; gtype = 'fora'; text = tpl(r.pick(side === 0 ? T.fora : T.foraOpp), o);
    if (side === 0 && min <= f.longeUntil) { q += 0.08; byCard = 'longe'; }
    if (side === 0 && run.selecao === 'bra82') q *= 1.4;

  else if (type === 'escanteio') {
    const ecn = side === 0 && has(run, 'escanteio_nunca');

    text = isGK ? tpl(r.pick(T.gkUp), o) : tpl(r.pick(T.escanteio), o);

  }
  else if (type === 'falta') { q = 0.13; gtype = 'fora'; text = isGK ? tpl(r.pick(T.gkFalta), o) : tpl(r.pick(T.falta), o); if (side === 0 && run.selecao === 'bra82') q *= 1.4; }
  else if (type === 'penalti') { q = 0.74; gtype = 'penalti'; text = opts.juiz ? `${scorerName} vai pra cobrança...` : tpl(T.penalti[0], o); }

  if (type !== 'penalti') {
    q += (A.atk - D.def) * 0.007 + (scorerRating - A.atk) * 0.003 - (D.gk - 65) * 0.003;
    const wq = { chuva: (type === 'fora' || type === 'falta') ? 0.85 : 1, neblina: (type === 'cruz' || type === 'escanteio') ? 0.9 : 1, altitude: type === 'fora' ? 1.12 : 1 }[m.weather] || 1;

<script>/* Canal do duelo: presença + broadcast. A tabela `duels` é opcional (reconexão). */

function linesCmp(me, op) {
  const rows = [['ATQ', 'atk'], ['MEI', 'mid'], ['DEF', 'def'], ['GOL', 'gk']];
  const w = v => Math.max(4, Math.min(100, (v - 35) * 1.6));
  return `<div class="cmp">${rows.map(([l, k]) => {
    const a = Math.round(me[k]), b = Math.round(op[k]);
    return `<b class="v ${a > b ? 'adv' : a < b ? 'dis' : ''}">${a}</b><div class="bar me"><i style="width:${w(me[k])}%"></i></div><span class="l">${l}</span><div class="bar op"><i style="width:${w(op[k])}%"></i></div><b class="v">${b}</b>`;
  }).join('')}</div>`;
}
const FORM_HUB = { GOL: [[50, 88]], ZAG: [[28, 66], [72, 66]], MEI: [[28, 41], [72, 41]], ATA: [[28, 16], [72, 16]] };
function formationHtml(run) {
  const pi = E.promessaIndex(run), sel = { kit: myKit(run) };

  const slots = run.players.map((p, i) => {
    const pos = FORM_HUB[p.pos][cnt[p.pos]++] || [50, 50];

function confettiBurst(cols, n) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * .4 + 's'; c.style.animationDuration = 1.2 + Math.random() + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2700);
  }
}

function celebrateFx(cols) {
  if (RM()) return;

  if (fx === 'fx_raio') { const r = document.createElement('div'); r.className = 'boltfx'; r.innerHTML = '<svg viewBox="0 0 60 200"><path d="M38 0L8 110h20L14 200 54 70H32L46 0z"/></svg>'; document.body.appendChild(r); setTimeout(() => r.remove(), 1100); return confettiBurst(['#fff', '#ffe14d'], 14); }
  const ch = { fx_bolas: null, fx_estrelas: '⭐', fx_fogos: null }[fx];
  if (fx === 'fx_fogos') {
    for (let k = 0; k < 4; k++) setTimeout(() => {
      const cx = 15 + Math.random() * 70, cy = 15 + Math.random() * 35, col = ['#ffc83d', '#c6ff3d', '#ff5a5f', '#7cc4ff'][k];
      for (let i = 0; i < 18; i++) { const s = document.createElement('div'); s.className = 'spark'; const a = i / 18 * Math.PI * 2; s.style.left = cx + 'vw'; s.style.top = cy + 'vh'; s.style.background = col; s.style.setProperty('--dx', Math.cos(a) * 90 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 90 + 'px'); document.body.appendChild(s); setTimeout(() => s.remove(), 1000); }
    }, k * 260);
    return;
  }
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('div'); c.className = 'conf emo'; c.innerHTML = ch || ballSvg('ico');
    c.style.left = Math.random() * 100 + 'vw'; c.style.animationDelay = Math.random() * .5 + 's'; c.style.animationDuration = 1.3 + Math.random() + 's';

}

  return `<div class="dside ${win ? 'win' : ''}">${win ? '<div class="crown">👑</div>' : ''}<div class="eyebrow">${esc(lbl)}</div><div class="dn">${esc(s.n)}</div><div class="df">${sel.flag} ${esc(sel.curto)}</div><div class="dp num">${fmtN(s.p)}</div><div class="xs mut">${M.REACH[s.r]} · ${s.gf}-${s.ga}</div></div>`;
}
function duelCmpHtml(a, b, la, lb) {
  const w = M.duelWinner(a, b);
  const cell = (s, i) => { const h = s.h.find(x => x[0] === i); if (!h) return `<span class="dc no">—</span>`; const o = h[1] > h[2] || (h[3] != null && h[3] > h[4]) ? 'W' : h[1] < h[2] || (h[3] != null && h[3] < h[4]) ? 'L' : 'D'; return `<span class="dc ${o}">${h[1]}-${h[2]}${h[3] != null ? `<small>p ${h[3]}-${h[4]}</small>` : ''}</span>`; };
  return `<div class="duel"><div class="dhead2">${duelSideHtml(a, w === 0, la)}<div class="dvs">VS</div>${duelSideHtml(b, w === 1, lb)}</div>
    <div class="drows">${E.STAGES.map((s, i) => `<div class="dr">${cell(a, i)}<span class="dl">${s.curto}</span>${cell(b, i)}</div>`).join('')}</div>
    <div class="dwin">${w === -1 ? '🤝 Empate técnico!' : `🏆 ${esc((w === 0 ? a : b).n)} venceu o duelo!`}</div></div>`;
}
function renderDuelo() {
  const d = G.duelIn;
  if (!d) return go('home');
  if (d.b) {
    app.innerHTML = `<div class="topbar"><button class="chip" data-act="home">${ic('back')} Início</button><span class="sp"></span><span class="chip">${ic('dice')} ${esc(d.s)} · Nv ${d.l}</span></div>
    ${pageHead('Resultado do duelo', `${esc(d.a.n)} aceitou o desafio e devolveu. Rodada a rodada:`)}
    ${duelCmpHtml(d.b, d.a, 'Desafiante', 'Respondeu')}
    <div class="mctrl"><div class="row"><button class="btn sec" data-act="home">${ic('home')} Início</button><button class="btn gold" data-act="duelAccept">${ic('play')} Revanche</button></div></div>`;
    return;
  }
  const sel = E.SELECOES[d.a.sel];
  app.innerHTML = `<div class="topbar"><button class="chip" data-act="home">${ic('back')} Início</button><span class="sp"></span><span class="chip">${ic('users')} Duelo</span></div>
  <div class="duelin"><div class="eyebrow g">Você foi desafiado!</div><div class="disp" style="font-size:30px;font-style:italic;text-transform:uppercase;margin:4px 0">${esc(d.a.n)}</div>
    <p class="small" style="margin:0">jogou a Copa <b>${esc(d.s)}</b> (nível ${d.l}) com ${sel.flag} ${esc(sel.nome)} e fez</p>
    <div class="dp num" style="font-size:54px">${fmtN(d.a.p)}</div><div class="small">${M.REACH[d.a.r]} · ${d.a.h.length} jogos</div></div>
  <div class="panel"><div class="ph">${ic('info')} Como funciona</div><div class="small" style="display:grid;gap:6px"><div>• Mesma semente: mesmas seleções, técnicos sorteados, rivais e clima.</div><div>• O placar dele fica escondido até você terminar. Depois vem o comparativo rodada a rodada.</div><div>• Aí é só devolver o link com o seu resultado.</div></div></div>
  <div class="mctrl"><button class="btn gold shine" data-act="duelAccept">${ic('play')} Aceitar o duelo</button></div>`;
}

// ---------- fechamento da campanha: meta-jogo ----------
function metaFinalize(run, pts) {
  const st = G.store, R = { fom: Math.max(1, Math.floor(pts / 100)) };
  M.cosStore(st);
  st.fominhas += R.fom;
  R.liga = M.ligaAdd(st, pts);
  if (run.daily) R.streak = M.streakPlay(st, run.daily);
  R.missions = M.missionsCheck(st, run);
  R.album = M.albumCollect(st, run.players);
  R.coach = M.galleryAdd(st, run, pts);
  if (run.bolao) { R.bolao = M.bolaoSettle(run.bolao, M.reachIdx(run)); st.fominhas += R.bolao.payout; }
  if (run.legend) {
    const wk = run.legendWeek || M.isoWeek();
    if (!st.lenda || st.lenda.week !== wk) st.lenda = { week: wk, best: null, tries: 0, beat: 0 };
    st.lenda.tries++; if (st.lenda.best == null || pts > st.lenda.best) { st.lenda.best = pts; R.lendaRec = true; }
    if (run.status === 'champion') st.lenda.beat++;
  }
  if (run.duel) {
    const me = M.duelSide(run, st.coachName || 'Fominha', pts), them = run.duel.a, w = M.duelWinner(me, them);
    R.duel = { me, them, w };
    st.duels = [{ ts: Date.now(), vs: them.n, seed: run.seed, me: pts, them: them.p, win: w === 0 ? 1 : w === 1 ? 0 : -1 }].concat(st.duels || []).slice(0, 10);
  }
  return R;
}
function bolaoMark(b) { return b.hit ? `✅ <b style="color:var(--lime)">+${b.net}</b>` : b.beyond ? '↩️ foi além: aposta devolvida' : `❌ −${b.stake}`; }
function metaVerdictHtml(R, run) {
  if (!R) return '';
  let h = '';
  if (R.duel) h += `<div class="panel hl"><div class="ph">${ic('users')} Duelo</div>${duelCmpHtml(R.duel.me, R.duel.them, 'Você', 'Desafiante')}<button class="btn gold" style="margin-top:10px" data-act="duelReturn">${ic('share')} Devolver o desafio <small>copia o link</small></button></div>`;
  if (run.epics && run.epics.length) h += `<div class="panel"><div class="ph">⚡ Lances épicos da campanha <span class="r">${run.epics.length}</span></div>${run.epics.map((e, i) => `<button class="eprow" data-act="epicCard" data-i="${i}"><span class="ei">${e.icon}</span><span style="flex:1;text-align:left"><b>${esc(e.nome)}</b><small>${esc(e.scorer || '')} · ${e.min}' · ${e.oppFlag || ''} ${esc((e.opp || '').replace(/ \d{4}$/, ''))}</small></span><span class="chip">Ver card</span></button>`).join('')}</div>`;
  const rows = [];
  rows.push(`<div class="fline"><span>🪙 Fominhas da campanha (1 a cada 100 pts)</span><b>+${R.fom}</b></div>`);
  if (R.bolao) rows.push(`<div class="fline"><span>🎯 Bolão: palpite <b>${esc(M.BOLAO[R.bolao.guess].nome)}</b> · chegou <b>${esc(M.BOLAO[R.bolao.reach].nome)}</b>${R.bolao.hit ? ' · ACERTOU!' : R.bolao.beyond ? ' · foi além, aposta de volta' : ''}</span><b style="color:${R.bolao.net > 0 ? 'var(--lime)' : R.bolao.net < 0 ? '#ff9a9d' : '#fff'}">${R.bolao.net > 0 ? '+' : ''}${R.bolao.net}</b></div>`);
  R.missions.forEach(m => rows.push(`<div class="fline"><span>${ic('check')} Missão: ${esc(M.MISSIONS[m.id].txt)}</span><b>${m.cos ? cosChip(m.cos) : '+' + m.fominhas}</b></div>`));
  if (R.streak) rows.push(`<div class="fline"><span>🔥 Sequência do Desafio</span><b>${R.streak.cur} dia${R.streak.cur > 1 ? 's' : ''}${R.streak.novo ? ' · ' + R.streak.novo.icon + ' ' + esc(R.streak.novo.nome) : ''}</b></div>`);
  if (R.album.novos.length) rows.push(`<div class="fline"><span>${ic('card')} Figurinhas novas no álbum</span><b>+${R.album.novos.length}</b></div>`);
  R.album.kits.forEach(k => rows.push(`<div class="fline"><span>👕 Página completa! Uniforme liberado</span><b>${cosChip(k)}</b></div>`));
  if (R.lendaRec) rows.push(`<div class="fline"><span>${ic('trophy')} Recorde da semana no Técnico Lendário</span><b>${fmtN(G.store.lenda.best)}</b></div>`);
  h += `<div class="panel"><div class="ph">${ic('gift')} Recompensas <span class="r">🪙 ${fmtN(G.store.fominhas)}</span></div>${rows.join('')}</div>`;
  h += `<div class="panel"><div class="ph">${ic('rank')} Divisão da semana</div>${ligaBar(G.store)}</div>`;
  return h;
}
// ---------- atalhos de teste (não aparecem pro jogador) ----------
function setupRun(o) {
  o = o || {};
  G.pendingSeed = E.normalizeSeed(o.seed || '') || E.randomSeed(); G.pendingLevel = o.level || 1; G.pendingDaily = o.daily || null; G.pendingLegend = o.legend || null; G.pendingDuel = o.duel || null; G.pendingBolao = o.bolao || null;
  newRunFromPending(E.selecaoChoices(G.pendingSeed)[o.sel || 0]);
  const d = E.coachDraftNew(G.run.seed);
  while (!d.done) { const c = E.COACH_BY_ID[d.current]; const free = E.COACH_ATTR_IDS.filter(a => !d.slots[a]); E.draftPick(d, free.reduce((x, a) => c.s[a] > c.s[x] ? a : x, free[0])); }
  G.run.coach = E.makeCoach(G.store.coachName || 'Professor Fominha', d.slots);
  if (o.stage) G.run.stage = o.stage;
  if (!o.noGo) go('hub');
}
function autoRun(o) {
  o = o || {}; setupRun({ ...o, noGo: true });
  let guard = 0;
  while (G.run.status === 'playing' && guard++ < 12) {
    const m = E.createMatch(G.run); applyDebug(m);
    E.simulateRest(m, mm => { const pl = E.playableCards(mm); return pl.length ? pl[0] : null; });
    G.match = m; G.result = E.finishMatch(G.run, m);
    if (G.result.reward && G.run.status === 'playing') { const off = E.genRewards(G.run); const it = off.find(x => x.type === 'player' || !E.needsTarget(G.run, x)); if (it) E.applyItem(G.run, it); }
  }
  finalizeRun(); go('verdict');
}
function quickMatch() { const m = E.createMatch(G.run); applyDebug(m); E.simulateRest(m, () => null); G.match = m; G.result = E.finishMatch(G.run, m); if (G.run.status !== 'playing') finalizeRun(); go('result'); }
function newRunFromPending(selId) {
  const st = G.store;
  G.run = E.newRun(G.pendingSeed, G.pendingLevel, selId, null, { legend: G.pendingLegend });
  G.run.daily = G.pendingDaily; G.run.legendWeek = G.pendingLegend ? M.isoWeek() : null; G.run.duel = G.pendingDuel || null;
  if (G.cup && G.cup.seed === G.run.seed) {
    G.run.cupRole = G.cup.role; G.run.cupId = G.cup.id;
    G.cup.built = FFBracket.buildCup(G.run.seed);
    FFBracket.groupOpponents(G.cup.built, G.cup.role).forEach((o, i) => { G.run.opponents[i] = o; });
    try { sessionStorage.setItem('ffcup', G.cup.id); } catch (e) { /* ignora */ }
  }
  if (G.pendingBolao && G.pendingDaily) { const b = G.pendingBolao; M.cosStore(st); if (b.stake > st.fominhas) b.stake = 0; st.fominhas -= b.stake; G.run.bolao = b; }
  G.pendingBolao = null;
  M.albumCollect(st, G.run.players); saveStore();
}

// ---------- ações ----------
document.addEventListener('click', onClick);
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); } });
function onClick(ev) {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (navigator.vibrate && !RM()) try { navigator.vibrate(8); } catch (er) { /* sem vibração */ }
  switch (a) {
    case 'level': {
      const n = +el.dataset.n, l = E.LEVELS[n - 1];
      if (l.locked) return toast('Em breve! 🔒');
      if (n > G.store.unlocked) return toast(`Seja campeão no nível ${n - 1} pra liberar 🔒`);
      G.pendingSeed = $('#seedIn') ? $('#seedIn').value : G.pendingSeed;
      G.store.level = n; saveStore(); renderHome(); break;
    }
    case 'start': startRun($('#seedIn') ? $('#seedIn').value : ''); break;
    case 'daily': go('daily'); break;
    case 'playDaily': bolaoSheet(); break;
    case 'bguess': G.bolaoPick.guess = +el.dataset.i; G.bolaoDraw(); break;
    case 'bstake': G.bolaoPick.stake = +el.dataset.s; G.bolaoDraw(); break;
    case 'bgo': { const b = { ...G.bolaoPick }; startRun(dailySeed(), todayKey()); G.pendingBolao = b.stake ? b : null; break; }
    case 'tab': go(el.dataset.t); break;
    case 'apage': G.albumPage = el.dataset.p; renderAlbum(); syncTabbar(); break;
    case 'costab': G.cosTab = el.dataset.t; renderPerfil(); break;
    case 'equip': if (M.equipCos(G.store, el.dataset.id)) { saveStore(); toast('Equipado! ✨'); renderPerfil(); } break;
    case 'buycos': if (M.buyCos(G.store, el.dataset.id)) { M.equipCos(G.store, el.dataset.id); saveStore(); toast('Comprado e equipado! 🪙'); renderPerfil(); } else toast('Fominhas insuficientes'); break;
    case 'playLegend': { const wk = M.isoWeek(); startRun(M.legendSeed(wk), null); G.pendingLegend = M.legendOfWeek(wk); G.pendingLevel = 1; render(); break; }
    case 'epicSel': G.epicIdx = +el.dataset.i; renderResult(); break;
    case 'epicPng': downloadEpic(el.dataset.i === 'm' ? G.epicModal : { ...G.result.epics[+el.dataset.i], seed: G.run.seed }); break;
    case 'epicCard': epicModal(G.run.epics[+el.dataset.i]); break;
    case 'liveDuel': openLiveDuel($('#seedIn') ? $('#seedIn').value : ''); break;
    case 'cupTeam': G.pendingSeed = G.cup.seed; G.pendingLevel = G.cup.level; G.pendingDaily = null; G.pendingLegend = null; G.pendingDuel = null; go('selecao'); break;
    case 'cupCopy': { const url = G.lastDuelLink || (location.href.split('#')[0] + location.hash); copyText(url).then(ok => toast(ok ? 'Link do duelo copiado!' : url)); break; }
    case 'cupBack': go(G.run && G.run.stage >= 3 && !G.cup.koSeen ? 'chave' : 'hub'); break;
    case 'cupBoard': if (G.cup) { G.cup.mode = G.run && G.run.stage >= 3 ? 'ko' : 'start'; G.screen = 'chave'; render(); } break;
    case 'cupRetry': cupRetry(); break;
    case 'pvpcard': pvpChoose(el.dataset.c || ''); break;
    case 'duelLink': { const d = { v: 1, s: G.run.seed, l: G.run.level, a: M.duelSide(G.run, G.store.coachName || 'Fominha', G.verdict.points) }; const url = duelLink(d); G.lastDuelLink = url; copyText(`⚔️ Duelo no Fominha FC! Fiz ${fmtN(G.verdict.points)} pts na Copa ${G.run.seed}. Duvido você me passar: ${url}`).then(ok => toast(ok ? 'Link do duelo copiado! Manda no grupo ⚔️' : 'Não deu pra copiar o link')); break; }
    case 'duelReturn': { const R = G.metaRes.duel; const d = { v: 1, s: G.run.seed, l: G.run.level, a: R.me, b: R.them }; const url = duelLink(d); G.lastDuelLink = url; copyText(`⚔️ Respondi teu duelo no Fominha FC: ${fmtN(R.me.p)} x ${fmtN(R.them.p)}. Confere: ${url}`).then(ok => toast(ok ? 'Resposta copiada! Devolve pro amigo ⚔️' : 'Não deu pra copiar')); break; }
    case 'duelAccept': { const d = G.duelIn; const duel = d.b ? { v: 1, s: d.s, l: d.l, a: d.a } : d; startRun(d.s, null); G.pendingLevel = d.l; G.pendingDuel = duel; history.replaceState(null, '', location.pathname + location.search); render(); break; }
    case 'howto': howtoModal(); break;
    case 'home': G.pendingSeed = ''; go('home'); break;
    case 'pick': newRunFromPending(el.dataset.id); G.draft = E.coachDraftNew(G.run.seed); toast(`${selOf(G.run).flag} ${selOf(G.run).nome} na Copa!`); G.screen = 'coach'; render(); spinCoach(); break;
    case 'cpick': if (E.draftPick(G.draft, el.dataset.a)) { if (G.draft.done) { renderCoach(); toast('Técnico montado!'); } else spinCoach(); } break;
    case 'creroll': if (E.draftReroll(G.draft)) spinCoach(); break;
    case 'cdone': { const nm = ($('#coachName') && $('#coachName').value.trim()) || G.store.coachName || 'Professor Fominha'; G.store.coachName = nm; saveStore(); G.run.coach = E.makeCoach(nm, G.draft.slots); go('hub'); break; }
    case 'play': G.match = E.createMatch(G.run); applyDebug(G.match); go('match'); break;
    case 'speed': G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; el.innerHTML = `${ic('fast')} ${G.speed}x`; break;
    case 'usecard': useCard(el.dataset.c); break;
    case 'afterResult': afterResult(); break;
    case 'openPack': {
      el.classList.add('open'); G.packOpen = true; G.flipNow = true;
      setTimeout(() => { if (G.screen === 'reward') renderReward(); }, RM() ? 0 : 450); break;
    }
    case 'takeReward': takeReward(+el.dataset.i); break;
    case 'rerollReward': { const o = E.rerollRewards(G.run); if (o) { G.offers = o; G.flipNow = true; renderReward(); } break; }
    case 'skipReward': G.run.fichas += 1; toast('+1 ficha'); if (G.result && G.result.shop) { G.shop = E.genShop(G.run); go('shop'); } else go('hub'); break;
    case 'buy': buy(+el.dataset.i); break;
    case 'rerollShop': { const s = E.rerollShop(G.run); if (s) { G.shop = s; renderShop(); } break; }
    case 'sell': { const v = E.sellRelic(G.run, el.dataset.id); toast(`Vendida por ${v} fichas`); renderShop(); break; }
    case 'leaveShop': go('hub'); break;
    case 'share': shareCard(); break;
    case 'challenge': copyText(shareText(G.verdict)).then(ok => toast(ok ? 'Convite copiado! Manda no grupo 📲' : 'Semente: ' + G.verdict.seed)); break;
    case 'again': G.pendingSeed = ''; startRun(''); break;
    case 'sameSeed': startRun(G.run.seed, G.run.daily); break;
    case 'info': showInfo(el.dataset.k, el.dataset.id); break;
    case 'tipok': G.store.tips[el.dataset.k] = 1; saveStore(); el.closest('.tip').remove(); break;
    case 'tipskip': G.store.tipsOff = true; saveStore(); document.querySelectorAll('.tip').forEach(x => x.remove()); break;
  }
}
// expõe para testes/screenshot
window.FFUI = { G, M, go, render, runPoints, dailySeed, drawCard, autoRun, setupRun, quickMatch, epicPNG, saveStore, applyDebug, previewDuel };
document.addEventListener('input', ev => { if (ev.target && ev.target.id === 'coachName') { G.store.coachName = ev.target.value.trim() || 'Professor Fominha'; saveStore(); } });
function readDuelHash() {
  const h = location.hash.match(/duelo=([A-Za-z0-9_-]+)/);
  if (!h) return false;
  const d = M.duelDecode(h[1]);
  if (!d) { toast('Link de duelo inválido'); return false; }
  if (d.v === 2) {
    let role = 1;
    try { if (sessionStorage.getItem('ffcup') === d.id) role = 0; } catch (e) { /* ignora */ }
    G.cup = { id: d.id, seed: d.s, level: d.l, host: d.host, role, mode: 'start', koSeen: false, status: 'connecting', friend: null };
    restoreSnap();
    G.screen = 'chave';
    if (G.cup.final && G.cup.final.home && G.cup.final.locks && G.cup.final.locks.length && G.run && G.run.stage >= 6 && G.run.status === 'playing') setTimeout(() => resumeFinal(G.cup.final), 20);
    setTimeout(cupConnect, 40);
    return true;
  }
  G.duelIn = d; G.screen = 'duelo'; return true;
}
window.addEventListener('hashchange', () => { if (readDuelHash()) render(); });
readDuelHash();
render();
})();
